[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "winwidgetkit"
version = "0.6.0"
description = "Movable, resizable, persistent and scriptable Windows desktop widgets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
winwidgets-demo = "winwidgetkit.demo:main"
[tool.setuptools.packages.find]
where = ["src"]
